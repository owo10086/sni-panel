name: Release panel, Agent, FXP, image and docs
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      resume_run:
        description: 'Recover verified-candidate from this run ID; select the SAME immutable version tag above'
        required: false
        default: ''
        type: string
permissions:
  actions: read
  contents: write
  packages: write
  pages: write
  id-token: write
# Serialize all versions, so an interrupted old version cannot race a new latest.
concurrency:
  group: forwardx-official-release
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !inputs.resume_run }}
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
  candidate:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Require version tag from the authorized repository
        run: |
          test "$GITHUB_REPOSITORY" = owo10086/sni-panel
          test "$GITHUB_REF_TYPE" = tag
          node scripts/check-versions.mjs
      - uses: actions/download-artifact@v4
        with:
          name: verified-panel
          path: .release/download
      - uses: actions/download-artifact@v4
        with:
          name: verified-agent
          path: .release/download
      - uses: actions/download-artifact@v4
        with:
          pattern: verification-*
          merge-multiple: true
          path: .release/evidence
      - name: Assemble the verified outputs without rebuilding
        run: |
          tar -xzf .release/download/panel-output.tar.gz
          tar -xzf .release/download/agent-output.tar.gz
          for archive in .release/evidence/*.tar.gz; do tar -xzf "$archive"; done
          node scripts/release/assemble.mjs
          node scripts/release/prepare-image-context.mjs
          echo "VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build candidate only, without public version tags
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .release/image-context
          file: Dockerfile.release
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/owo10086/sni-panel,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FORWARDX_VERSION=${{ env.VERSION }}
            FORWARDX_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=forwardx-release
          cache-to: type=gha,mode=max,scope=forwardx-release
      - name: Validate the actual package, native dependencies and image startup by digest
        env:
          RELEASE_IMAGE: ghcr.io/owo10086/sni-panel@${{ steps.image.outputs.digest }}
        run: |
          node scripts/release/smoke-image.mjs
          node scripts/release/seal.mjs
      - name: Preserve immutable candidate for recovery
        uses: actions/upload-artifact@v4
        with:
          name: verified-candidate
          path: .release/candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Archive candidate evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence-${{ github.run_attempt }}
          path: .release/checks
          include-hidden-files: true
  publish:
    needs: [verify, candidate]
    if: ${{ always() && (needs.candidate.result == 'success' || inputs.resume_run != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@v4
        with:
          name: verified-candidate
          path: .release/candidate
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Draft, upload, download and verify all assets before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/publish.mjs
      - name: Extract the documentation from the original verified candidate
        run: |
          mkdir -p .release/pages
          node --input-type=module -e 'import fs from "node:fs"; import {execFileSync} from "node:child_process"; const m=JSON.parse(fs.readFileSync(".release/candidate/manifest.json")); execFileSync("tar", ["-xzf", `.release/candidate/forwardx-docs-v${m.version}.tar.gz`, "-C", ".release/pages"]);'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .release/pages
      - name: Publish the already verified documentation
        id: pages
        uses: actions/deploy-pages@v4
      - name: Reconcile final versions and record publication complete
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.pages.outputs.page_url }}
        run: node scripts/release/publish.mjs finish-docs
      - name: Preserve resumable state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-state-${{ github.run_attempt }}
          path: .release/state.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Report incomplete publication
        if: failure()
        run: echo '::error::Publication incomplete. Recover with resume_run using the original verified-candidate; do not move the tag or rebuild assets.'
