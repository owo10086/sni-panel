<div id="fx-other-rules" class="viz-dotted-background" aria-label="其他转发规则沿用 SNI 排版的讨论草案">
  <style>
    #fx-other-rules { color-scheme: light dark; --fo-bg: light-dark(#fff,#242f32); --fo-head: light-dark(#edf3f1,#2b3a3d); --fo-ink: light-dark(#243036,#e4eded); --fo-dim: light-dark(#60737b,#a5b6bd); --fo-line: light-dark(#dbe5e3,#415053); --fo-hover: light-dark(#e8f1ee,#34484b); --fo-green: light-dark(#087958,#6fdbb2); --fo-gold: light-dark(#906500,#eccc37); --fo-red: light-dark(#b82636,#ff8c99); --fo-shadow: light-dark(#cbd7d2,#172022); padding: 12px; color: var(--fo-ink); font: 13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; position: relative; }
    #fx-other-rules * { box-sizing: border-box; }
    #fx-other-rules button { font: inherit; color: inherit; border: 0; background: transparent; padding: 4px 6px; border-radius: 5px; }
    #fx-other-rules button:hover { background: var(--fo-hover); }
    #fx-other-rules button:disabled { opacity: .6; }
    #fx-other-rules .fo-window { border: 1px solid var(--fo-line); border-radius: 8px; background: var(--fo-bg); overflow: hidden; }
    #fx-other-rules .fo-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 5px 16px; padding: 12px 16px; background: var(--fo-head); border-bottom: 1px solid var(--fo-line); }
    #fx-other-rules .fo-heading strong { font-weight: 600; }
    #fx-other-rules .fo-dim { color: var(--fo-dim); font-size: 12px; }
    #fx-other-rules .fo-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--fo-dim) var(--fo-head); }
    #fx-other-rules table { width: 1285px; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 12px; }
    #fx-other-rules th, #fx-other-rules td { text-align: left; padding: 12px; border-bottom: 1px solid var(--fo-line); vertical-align: middle; background: var(--fo-bg); }
    #fx-other-rules th { background: var(--fo-head); color: var(--fo-dim); font-weight: 400; white-space: nowrap; }
    #fx-other-rules td { height: 76px; }
    #fx-other-rules .fo-left { position: sticky; left: 0; z-index: 2; box-shadow: 2px 0 5px -2px var(--fo-shadow); }
    #fx-other-rules .fo-right { position: sticky; right: 0; z-index: 2; box-shadow: -2px 0 5px -2px var(--fo-shadow); }
    #fx-other-rules .fo-name { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 500; }
    #fx-other-rules .fo-name input { margin: 0; accent-color: var(--fo-green); }
    #fx-other-rules .fo-dot { color: var(--fo-green); }
    #fx-other-rules .fo-kind { margin: 3px 0 0 28px; color: var(--fo-dim); }
    #fx-other-rules .fo-mono { font-family: ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap: anywhere; }
    #fx-other-rules .fo-port { color: var(--fo-dim); }
    #fx-other-rules .fo-resource { color: var(--fo-green); text-align: left; padding-left: 0; text-decoration: underline dotted; text-underline-offset: 4px; max-width: 100%; overflow-wrap: anywhere; }
    #fx-other-rules .fo-numeric { font-variant-numeric: tabular-nums; white-space: nowrap; }
    #fx-other-rules .fo-detail { color: var(--fo-dim); text-decoration: underline; text-underline-offset: 3px; }
    #fx-other-rules .fo-latency { text-decoration: underline dotted; text-underline-offset: 4px; white-space: nowrap; }
    #fx-other-rules .fo-latency[data-ms] { color: var(--fo-gold); }
    #fx-other-rules .fo-grade { font-size: 11px; margin-left: 5px; }
    #fx-other-rules .fo-actions { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    #fx-other-rules .fo-switch { padding: 5px; display: inline-flex; align-items: center; }
    #fx-other-rules .fo-track { width: 27px; height: 16px; border-radius: 12px; background: var(--fo-ink); position: relative; }
    #fx-other-rules .fo-track::after { content: ''; position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fo-bg); }
    #fx-other-rules .fo-switch[aria-checked="false"] .fo-track { background: var(--fo-dim); }
    #fx-other-rules .fo-switch[aria-checked="false"] .fo-track::after { right: auto; left: 2px; }
    #fx-other-rules td.fo-expanded { height: auto; padding: 0; background: var(--fo-head); }
    #fx-other-rules .fo-detail-content { position: sticky; left: 0; width: var(--fo-detail-width,680px); max-width: 100%; padding: 12px 16px; display: grid; gap: 6px; overflow-wrap: anywhere; }
    #fx-other-rules .fo-detail-content p { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 20px; }
    #fx-other-rules .fo-detail-content strong { font-weight: 600; }
    #fx-other-rules .fo-pair { display: inline-flex; align-items: baseline; max-width: 100%; }
    #fx-other-rules .fo-pair strong { flex-shrink: 0; }
    #fx-other-rules .fo-pair span { min-width: 0; }
    #fx-other-rules .fo-scroll-control { padding: 10px 12px; display: flex; align-items: center; gap: 12px; color: var(--fo-dim); font-size: 12px; }
    #fx-other-rules .fo-scroll-control input { flex: 1; min-width: 0; accent-color: var(--fo-green); }
    #fx-other-rules dialog { color: var(--fo-ink); background: var(--fo-bg); border: 1px solid var(--fo-line); border-radius: 10px; width: min(390px,calc(100% - 24px)); max-height: 85%; padding: 18px; font: inherit; }
    #fx-other-rules dialog::backdrop { background: light-dark(#23363055,#0c171b88); }
    #fx-other-rules .fo-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-weight: 600; }
    #fx-other-rules .fo-menu { position: absolute; z-index: 10; right: 20px; width: 162px; padding: 5px; border: 1px solid var(--fo-line); border-radius: 7px; background: var(--fo-bg); box-shadow: 0 8px 24px -8px var(--fo-shadow); }
    #fx-other-rules .fo-menu button { display: block; text-align: left; width: 100%; padding: 9px 8px; }
    #fx-other-rules .fo-menu [data-action="删除"] { color: var(--fo-red); }
    #fx-other-rules dl { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; margin: 0; }
    #fx-other-rules dt { color: var(--fo-dim); }
    #fx-other-rules dd { margin: 0; font-variant-numeric: tabular-nums; }
    #fx-other-rules .fo-note { margin-top: 8px; font-size: 12px; color: var(--fo-dim); }
    #fx-other-rules [hidden] { display: none !important; }
    @media (max-width: 480px) { #fx-other-rules .fo-right { position: static; } }
    @media (pointer: coarse) { #fx-other-rules button { min-height: 44px; } }
  </style>
  <div class="fo-window">
    <div class="fo-heading"><strong>其他转发规则</strong><span class="fo-dim">沿用 SNI 排版 · 讨论草案 · 示例数据</span></div>
    <div class="fo-scroll" aria-label="其他规则表格，可左右滚动">
      <table aria-label="本机、隧道、转发链和转发组的显示草案">
        <colgroup><col style="width:160px"><col style="width:185px"><col style="width:210px"><col style="width:205px"><col style="width:65px"><col style="width:140px"><col style="width:140px"><col style="width:180px"></colgroup>
        <thead><tr><th class="fo-left">状态 · 规则</th><th>所属资源</th><th>转发入口</th><th>转发出口</th><th>协议</th><th>累计</th><th>延迟</th><th class="fo-right">开关 · 操作</th></tr></thead>
        <tbody data-rows></tbody>
      </table>
    </div>
    <label class="fo-scroll-control">左右滚动<input type="range" min="0" max="100" value="0" aria-label="左右滚动查看全部列" class="cursor-interaction"></label>
  </div>
  <div class="fo-menu" role="menu" aria-label="更多操作" hidden><button type="button" role="menuitem" class="cursor-interaction" data-action="24小时流量">24小时流量</button><button type="button" role="menuitem" class="cursor-interaction" data-action="链路自测">链路自测</button><button type="button" role="menuitem" class="cursor-interaction" data-action="重置统计">重置统计</button><button type="button" role="menuitem" class="cursor-interaction" data-action="删除">删除</button></div>
  <dialog aria-label="规则操作"><div class="fo-dialog-head"><span data-dialog-title></span><button type="button" data-close class="cursor-interaction" aria-label="关闭">×</button></div><div data-dialog-body></div></dialog>
  <div class="fo-note" aria-live="polite" data-feedback>布局演示 · 点击所属资源展开详情</div>
  <script>
    (() => {
      const root = document.getElementById('fx-other-rules');
      const rows = root.querySelector('[data-rows]');
      const scroll = root.querySelector('.fo-scroll');
      const slider = root.querySelector('input[type="range"]');
      const dialog = root.querySelector('dialog');
      const menu = root.querySelector('.fo-menu');
      const dialogTitle = root.querySelector('[data-dialog-title]');
      const dialogBody = root.querySelector('[data-dialog-body]');
      const feedback = root.querySelector('[data-feedback]');
      const examples = [
        { id:'local', name:'香港直连', kind:'本机转发', resource:'入口-广州', entry:'gz-entry.example.com', port:'20022', exit:'hk-target.example.com', outPort:'443', protocol:'TCP', traffic:'9.27 GB', used:'9.13 GB', latency:147, route:'本机直连 · nftables', details:[['主机','入口-广州'],['转发路径','入口-广州 → 香港目标']], incoming:'35.64 MB', outgoing:'1.51 GB' },
        { id:'tunnel', name:'日本隧道', kind:'隧道转发', resource:'广州 → 东京隧道', entry:'gz-entry.example.com', port:'21001', exit:'jp-target.example.com', outPort:'443', protocol:'TCP', traffic:'270 MB', used:'248.13 MB', latency:null, route:'隧道转发', details:[['隧道','广州 → 东京隧道'],['转发路径','入口-广州 → 隧道 → 落地-东京 → 日本目标']], incoming:'12 MB', outgoing:'55 MB' },
        { id:'chain', name:'新加坡链路', kind:'转发链', resource:'广州 → 香港 → 新加坡', entry:'gz-entry.example.com', port:'22001', exit:'sg-target.example.com', outPort:'8443', protocol:'TCP', traffic:'2.46 GB', used:'2.18 GB', latency:188, route:'转发链 · 2 段', details:[['转发链','广州 → 香港 → 新加坡'],['转发路径','入口-广州 → 中转-香港 → 落地-新加坡 → 业务目标']], incoming:'28 MB', outgoing:'412 MB' },
        { id:'group', name:'美国主备', kind:'转发组', resource:'美国入口主备', entry:'us-entry.example.com', port:'23001', exit:'us-target.example.com', outPort:'443', protocol:'TCP', traffic:'6.81 GB', used:'6.34 GB', latency:203, route:'转发组 · nftables', details:[['转发组','美国入口主备 · 主机型 · 主备'],['当前','入口-美国 A'],['备用','入口-美国 B']], incoming:'48 MB', outgoing:'720 MB' }
      ];
      const state = { expanded:'local', scroll:0, results:{}, enabled:{} };
      const tests = new Set();
      let activeId = 'local';
      const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      function save(action) {
        if (window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{preview:'other-rules-sni-style',action,expanded:state.expanded},privateContent:{version:1,...state}}).catch(() => {});
      }
      function latencyMarkup(rule) {
        if (tests.has(rule.id)) return '测试中…';
        const ms = state.results[rule.id] ?? rule.latency;
        return ms === null ? '未测' : escape(ms) + ' ms<span class="fo-grade">' + (ms < 200 ? '良好' : '一般') + '</span>';
      }
      function render() {
        rows.innerHTML = examples.map(rule => {
          const expanded = state.expanded === rule.id;
          const ms = state.results[rule.id] ?? rule.latency;
          const firstDetail = rule.details[0];
          const detail = rule.details.slice(1).map(([label,value]) => '<p><span class="fo-pair"><strong>' + escape(label) + '：</strong><span>' + escape(value) + '</span></span></p>').join('');
          return '<tr><td class="fo-left"><div class="fo-name"><input type="checkbox" aria-label="选择' + escape(rule.name) + '"><span class="fo-dot" aria-label="运行中">●</span><span>' + escape(rule.name) + '</span></div><div class="fo-kind">' + escape(rule.kind) + '</div></td>' +
            '<td><button type="button" class="fo-resource cursor-interaction" data-resource="' + rule.id + '" aria-expanded="' + expanded + '" aria-controls="fo-details-' + rule.id + '">' + escape(rule.resource) + (expanded ? ' ⌃' : ' ⌄') + '</button></td>' +
            '<td class="fo-mono">' + escape(rule.entry) + '<span class="fo-port">:' + rule.port + '</span></td><td class="fo-mono">' + escape(rule.exit) + '<span class="fo-port">:' + rule.outPort + '</span></td><td>' + rule.protocol + '</td>' +
            '<td class="fo-numeric">' + rule.traffic + ' <button type="button" class="fo-detail cursor-interaction" data-traffic="' + rule.id + '">详细</button></td>' +
            '<td><button type="button" class="fo-latency cursor-interaction fo-numeric" data-test="' + rule.id + '" ' + (ms !== null ? 'data-ms="' + ms + '"' : '') + (tests.has(rule.id) ? ' disabled aria-busy="true"' : '') + ' aria-label="' + escape(rule.name) + '，点击立即测试">' + latencyMarkup(rule) + '</button></td>' +
            '<td class="fo-right"><div class="fo-actions"><button type="button" role="switch" aria-checked="' + (state.enabled[rule.id] !== false) + '" aria-label="' + escape(rule.name) + '开关" class="fo-switch cursor-interaction" data-toggle="' + rule.id + '"><span class="fo-track"></span></button><button type="button" class="cursor-interaction" data-edit="' + rule.id + '">编辑</button><button type="button" class="cursor-interaction" aria-haspopup="menu" aria-expanded="false" data-more="' + rule.id + '">更多 ⋯</button></div></td></tr>' +
            '<tr id="fo-details-' + rule.id + '"' + (expanded ? '' : ' hidden') + '><td colspan="8" class="fo-expanded"><div class="fo-detail-content">' +
            '<p><span class="fo-pair"><strong>' + escape(firstDetail[0]) + '：</strong><span>' + escape(firstDetail[1]) + '</span></span><span class="fo-pair"><strong>链路：</strong><span>' + escape(rule.route) + '</span></span><span class="fo-pair"><strong>用户：</strong><span>admin@example.com</span></span></p>' + detail + '</div></td></tr>';
        }).join('');
      }
      function hideMenu() { menu.hidden = true; rows.querySelectorAll('[data-more]').forEach(button => button.setAttribute('aria-expanded','false')); }
      function show(title,markup) { hideMenu(); dialogTitle.textContent = title; dialogBody.innerHTML = markup; if (!dialog.open) dialog.showModal(); }
      function detailList(pairs) { return '<dl>' + pairs.map(([label,value]) => '<dt>' + escape(label) + '</dt><dd>' + escape(value) + '</dd>').join('') + '</dl>'; }
      function restore() {
        const stored = window.openai?.widgetState?.privateContent;
        if (stored?.version !== 1) return;
        state.expanded = examples.some(rule => rule.id === stored.expanded) ? stored.expanded : null;
        state.results = Object.fromEntries(examples.filter(rule => Number.isFinite(stored.results?.[rule.id])).map(rule => [rule.id,stored.results[rule.id]]));
        state.enabled = stored.enabled || {};
        state.scroll = Math.min(100,Math.max(0,Number(stored.scroll) || 0));
        render();
        slider.value = state.scroll;
        scroll.scrollLeft = state.scroll / 100 * Math.max(0,scroll.scrollWidth - scroll.clientWidth);
      }
      rows.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button || button.disabled) return;
        const id = button.dataset.resource || button.dataset.traffic || button.dataset.test || button.dataset.more || button.dataset.edit || button.dataset.toggle;
        const rule = examples.find(item => item.id === id);
        if (!rule) return;
        const previousActiveId = activeId;
        activeId = id;
        if (button.hasAttribute('data-resource')) { state.expanded = state.expanded === id ? null : id; render(); save('resource'); }
        else if (button.hasAttribute('data-traffic')) { show(rule.name + ' · 流量详情',detailList([['累计总流量',rule.traffic],['规则类型','管理员自定义规则'],['额度计量','仅出向'],['额度已用',rule.used],['额度','不限']])); save('traffic-detail'); }
        else if (button.hasAttribute('data-more')) { const opening = menu.hidden || previousActiveId !== id; hideMenu(); menu.hidden = !opening; button.setAttribute('aria-expanded',String(opening)); menu.style.top = Math.max(12,Math.min(button.getBoundingClientRect().bottom - root.getBoundingClientRect().top + 5,root.clientHeight - 195)) + 'px'; save('more'); }
        else if (button.hasAttribute('data-edit')) show(rule.name + ' · 编辑','保留该类型规则原来的编辑内容。');
        else if (button.hasAttribute('data-toggle')) { state.enabled[id] = state.enabled[id] === false; button.setAttribute('aria-checked',String(state.enabled[id])); feedback.textContent = '演示：' + rule.name + (state.enabled[id] ? '开启' : '关闭'); save('toggle'); }
        else if (button.hasAttribute('data-test')) {
          tests.add(id); button.disabled = true; button.setAttribute('aria-busy','true'); button.textContent = '测试中…'; feedback.textContent = '演示：' + rule.name + '开始测试';
          setTimeout(() => { const previous = state.results[id] ?? rule.latency; const baseline = rule.latency ?? 142; state.results[id] = previous === null ? baseline : previous === baseline ? Math.max(1,baseline - 5) : baseline; tests.delete(id); const current = rows.querySelector('[data-test="' + id + '"]'); if (current) { current.disabled = false; current.setAttribute('aria-busy','false'); current.dataset.ms = state.results[id]; current.innerHTML = latencyMarkup(rule); } feedback.textContent = '演示：' + rule.name + '测试完成，可点击再次测试'; save('test'); },1000);
        }
      });
      menu.addEventListener('click', event => {
        const button = event.target.closest('[data-action]');
        if (!button) return;
        const rule = examples.find(item => item.id === activeId);
        const action = button.dataset.action;
        if (action === '24小时流量') show(rule.name + ' · 24小时流量',detailList([['入向',rule.incoming],['出向',rule.outgoing]]));
        else if (action === '链路自测') show(rule.name + ' · 链路自测','<p>' + escape(rule.route) + '</p><button type="button" class="cursor-interaction" data-dialog-test>开始测试</button>');
        else show(rule.name + ' · ' + action,'布局演示，实际使用时保留现有确认步骤。');
      });
      dialogBody.addEventListener('click', event => { const button = event.target.closest('[data-dialog-test]'); if (!button) return; button.disabled = true; button.textContent = '测试中…'; setTimeout(() => { button.disabled = false; button.textContent = '测试完成（演示）· 再次测试'; },1000); });
      root.querySelector('[data-close]').addEventListener('click', () => dialog.close());
      root.addEventListener('click',event => { if (!event.target.closest('[data-more]') && !event.target.closest('.fo-menu')) hideMenu(); });
      root.addEventListener('keydown',event => { if (event.key === 'Escape') hideMenu(); });
      slider.addEventListener('input', () => { scroll.scrollLeft = Number(slider.value) / 100 * Math.max(0,scroll.scrollWidth - scroll.clientWidth); });
      slider.addEventListener('change', () => { state.scroll = Number(slider.value); save('scroll'); });
      scroll.addEventListener('scroll', () => { const width = scroll.scrollWidth - scroll.clientWidth; slider.value = width > 0 ? scroll.scrollLeft / width * 100 : 0; },{passive:true});
      window.addEventListener('openai:set_globals',restore);
      render(); restore();
      const fit = () => root.style.setProperty('--fo-detail-width',scroll.clientWidth + 'px');
      fit(); new ResizeObserver(fit).observe(scroll);
    })();
  </script>
</div>
